version: "1.0"
type: component
data:
  name: omv-services-microvm-schedule-datatable-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    stateId: 3f4d5e6a-7b8c-4a1d-9e2f-5c6d7e8f9a0b
    store:
      proxy:
        service: MicroVm
        get:
          method: getJobList
    columns:
      - name: _('Enabled')
        prop: enable
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
      - name: _("VM Name")
        prop: vmname
        flexGrow: 1
        sortable: true
      - name: _("Path")
        prop: path
        flexGrow: 2
        sortable: true
      - name: _('Scheduling')
        prop: ''
        flexGrow: 1
        cellTemplateName: template
        cellTemplateConfig: |
          {% if execution == "exactly" %}
          {% set _minute = minute %}
          {% set _hour = hour %}
          {% set _dayofmonth = dayofmonth %}
          {% if everynminute %}{% set _minute %}*/{{ minute }}{% endset %}{% endif %}
          {% if everynhour %}{% set _hour %}*/{{ hour }}{% endset %}{% endif %}
          {% if everyndayofmonth %}{% set _dayofmonth %}*/{{ dayofmonth }}{% endset %}{% endif %}
          {{ [_minute, _hour, _dayofmonth, month, dayofweek] | join(" ") | cron2human }}
          {% else %}
          {{ execution | capitalize | translate }}
          {% endif %}
      - name: _("Keep Recent")
        prop: keep
        flexGrow: 1
        sortable: true
    actions:
      - template: create
        execute:
          type: url
          url: "/services/microvm/schedule/create"
      - template: edit
        execute:
          type: url
          url: "/services/microvm/schedule/edit/{{ _selected[0].uuid }}"
      - template: delete
        execute:
          type: request
          request:
            service: MicroVm
            method: deleteJob
            params:
              uuid: "{{ _selected[0].uuid }}"
      - type: iconButton
        tooltip: _("Run")
        icon: mdi:play-box-outline
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Executing scheduled backup ...")
              startOnInit: false
              showCompletion: false
              request:
                service: MicroVm
                method: doJob
                params:
                  uuid: '{{ _selected[0].uuid }}'
