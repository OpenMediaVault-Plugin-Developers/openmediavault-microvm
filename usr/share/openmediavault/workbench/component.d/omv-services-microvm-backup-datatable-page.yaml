version: "1.0"
type: component
data:
  name: omv-services-microvm-backup-datatable-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    stateId: 8b1e7a3e-95f2-4d5a-9c6d-2e7f0a1b3c4d
    store:
      proxy:
        service: MicroVm
        get:
          method: getBackupList
    columns:
      - name: _("UUID")
        prop: uuid
        flexGrow: 1
        sortable: true
        hidden: true
      - name: _("VM Name")
        prop: vmname
        flexGrow: 1
        sortable: true
      - name: _("Date")
        prop: date
        flexGrow: 2
        sortable: true
      - name: _("Name")
        prop: name
        flexGrow: 1
        sortable: true
      - name: _("Warm")
        prop: warm
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
        hint: _("A warm backup includes the VM's memory/device state, not just its disk.")
      - name: _("Path")
        prop: path
        flexGrow: 3
        sortable: true
      - name: _("Size")
        prop: size
        flexGrow: 1
        sortable: true
        cellTemplateName: binaryUnit
      - name: _("Notes")
        prop: notes
        flexGrow: 2
        sortable: false
        hidden: true
    actions:
      - type: iconButton
        tooltip: _("Backup now")
        icon: mdi:content-save-outline
        execute:
          type: formDialog
          formDialog:
            title: _("Back up a VM ...")
            fields:
              - type: select
                name: vmname
                label: _("VM")
                placeholder: _("Select a VM ...")
                textField: name
                valueField: name
                store:
                  proxy:
                    service: MicroVm
                    get:
                      method: getVmNameStateList
                      params:
                        start: 0
                        limit: -1
                        sortfield: name
                        sortdir: ASC
                validators:
                  required: true
              - type: hidden
                name: rootfsref
                value: "79684322-3eac-11ea-a974-63a080abab18"
                submitValue: false
              - type: folderBrowser
                name: path
                label: _("Destination directory")
                value: ''
                dirType: mntent
                dirRefIdField: rootfsref
                validators:
                  required: true
              - type: numberInput
                name: keep
                label: _("Keep")
                value: 0
                validators:
                  min: 0
                  max: 65535
                hint: _("Keep the most recent number of backups for this VM in this directory. 0 keeps all.")
              - type: textInput
                name: name
                label: _("Name")
                value: ""
                hint: _("Optional label for this backup.")
              - type: textarea
                name: notes
                label: _("Notes")
                value: ""
                rows: 3
            buttons:
              submit:
                text: _("Backup")
                execute:
                  type: taskDialog
                  taskDialog:
                    config:
                      title: _("Backing up VM ...")
                      startOnInit: true
                      request:
                        service: MicroVm
                        method: doBackup
                        params:
                          vmname: "{{ vmname }}"
                          path: "{{ path }}"
                          keep: "{{ keep }}"
                          name: "{{ name }}"
                          notes: "{{ notes }}"
      - type: iconButton
        tooltip: _("Restore")
        icon: mdi:restore
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: formDialog
          formDialog:
            title: _("Restore backup ...")
            fields:
              - type: textInput
                name: backup
                label: _("Backup")
                readonly: true
                value: "{{ _selected[0].vmname }} | {{ _selected[0].date }} | {{ _selected[0].path }}"
              - type: hidden
                name: path
                value: "{{ _selected[0].path }}"
              - type: hidden
                name: vmname
                value: "{{ _selected[0].vmname }}"
              - type: hidden
                name: date
                value: "{{ _selected[0].date }}"
              - type: select
                name: vmuuid
                label: _("Restore onto VM")
                placeholder: _("Select a VM ...")
                textField: name
                valueField: uuid
                store:
                  proxy:
                    service: MicroVm
                    get:
                      method: enumerateVmNames
                hint: _("The target VM's current disk is overwritten with this backup's saved disk. Defaults to the VM the backup was taken from.")
                value: ""
                validators:
                  required: true
            buttons:
              submit:
                text: _("Restore")
                execute:
                  type: taskDialog
                  taskDialog:
                    config:
                      title: _("Restoring backup ...")
                      startOnInit: true
                      request:
                        service: MicroVm
                        method: restoreBackup
                        params:
                          vmuuid: "{{ vmuuid }}"
                          path: "{{ path }}"
                          vmname: "{{ vmname }}"
                          date: "{{ date }}"
        confirmationDialogConfig:
          template: confirmation-danger
          message: _("Restoring stops the target VM, permanently overwrites its current disk with this backup's saved disk, and boots from the backup's saved memory state if it has one. Any changes made since the backup was taken will be lost. Continue?")
      - type: iconButton
        tooltip: _("Sync backup list")
        icon: mdi:auto-fix
        confirmationDialogConfig:
          template: confirmation-danger
          message: _("This reconciles the backup list against what actually exists on disk, removing entries whose backup directory is gone. A copy of the list file is kept as omv-microvm-backup.list.bak. Continue?")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Syncing backup list ...")
              startOnInit: true
              showCompletion: true
              request:
                service: MicroVm
                method: syncBackupList
              buttons:
                stop:
                  hidden: true
      - template: delete
        confirmationDialogConfig:
          template: confirmation-danger
          message: _("Are you sure you want to delete this backup?")
        execute:
          type: request
          request:
            service: MicroVm
            method: deleteBackup
            params:
              uuid: "{{ _selected[0].uuid }}"
              path: "{{ _selected[0].path }}"
              vmname: "{{ _selected[0].vmname }}"
              date: "{{ _selected[0].date }}"
