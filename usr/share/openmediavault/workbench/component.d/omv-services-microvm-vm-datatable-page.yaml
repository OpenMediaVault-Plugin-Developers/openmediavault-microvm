version: "1.0"
type: component
data:
  name: omv-services-microvm-vm-datatable-page
  type: datatablePage
  config:
    autoReload: 10000
    hasSearchField: true
    stateId: 6f2a1c9a-8e2b-4d3e-9b7a-1a2b3c4d5e6f
    rowId: uuid
    sorters:
      - dir: asc
        prop: name
    store:
      proxy:
        service: MicroVm
        get:
          method: getVmList
    columns:
      - name: _("Name")
        prop: name
        flexGrow: 1
        sortable: true
      - name: _("State")
        prop: state
        flexGrow: 1
        sortable: true
      - name: _("AutoStart")
        prop: autostart
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
      - name: _("vCPUs")
        prop: vcpus
        flexGrow: 1
        sortable: true
      - name: _("Memory (MiB)")
        prop: memory_mib
        flexGrow: 1
        sortable: true
      - name: _("Image")
        prop: image_desc
        flexGrow: 2
        sortable: true
      - name: _("Bridge")
        prop: bridge
        flexGrow: 1
        sortable: true
        hidden: true
      - name: _("Notes")
        prop: notes
        flexGrow: 2
        sortable: false
        hidden: true
    actions:
      - type: iconButton
        icon: mdi:plus
        tooltip: _("Add new VM")
        execute:
          type: url
          url: /services/microvm/vm/create
      - type: iconButton
        icon: mdi:pencil
        tooltip: _("Edit")
        execute:
          type: url
          url: "/services/microvm/vm/edit/{{ _selected[0].uuid }}"
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
      - type: iconButton
        icon: mdi:information-outline
        tooltip: _("Details")
        execute:
          type: url
          url: "/services/microvm/vm/details/{{ _selected[0].name }}"
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
      - type: iconButton
        icon: mdi:console
        tooltip: _("Console")
        execute:
          type: url
          url: "/externalRedirect/{{ _selected[0].termurl | encodeuricomponent }}"
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: ne
              arg0:
                prop: termurl
              arg1: ""
      - type: menu
        icon: mdi:power
        tooltip: _("State")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        actions:
          - text: _("Start")
            icon: mdi:play-circle-outline
            execute:
              type: request
              request:
                service: MicroVm
                method: doCommand
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  command: "start"
                progressMessage: _("Starting ...")
                successNotification: _("Started.")
                task: false
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
              constraint:
                - operator: ne
                  arg0:
                    prop: state
                  arg1: "running"
          - text: _("Restart")
            icon: mdi:restart
            execute:
              type: request
              request:
                service: MicroVm
                method: doCommand
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  command: "restart"
                progressMessage: _("Restarting ...")
                successNotification: _("Restarted.")
                task: false
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
              constraint:
                - operator: eq
                  arg0:
                    prop: state
                  arg1: "running"
          - text: _("Stop")
            icon: mdi:stop-circle-outline
            execute:
              type: request
              request:
                service: MicroVm
                method: doCommand
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  command: "stop"
                progressMessage: _("Stopping ...")
                successNotification: _("Stopped.")
                task: false
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
              constraint:
                - operator: eq
                  arg0:
                    prop: state
                  arg1: "running"
          - text: _("Force stop")
            icon: mdi:arrow-down
            execute:
              type: request
              request:
                service: MicroVm
                method: doCommand
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  command: "forcestop"
                progressMessage: _("Forcing stop ...")
                successNotification: _("Force stopped.")
                task: false
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
              constraint:
                - operator: eq
                  arg0:
                    prop: state
                  arg1: "running"
      - type: menu
        icon: mdi:clock-start
        tooltip: _("AutoStart")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        actions:
          - text: _("Enable")
            icon: mdi:arrow-up-bold-outline
            execute:
              type: request
              request:
                service: MicroVm
                method: doCommand
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  command: "autostartenable"
                progressMessage: _("Enabling autostart ...")
                successNotification: _("Autostart has been enabled.")
                task: false
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
              constraint:
                - operator: falsy
                  arg0:
                    prop: autostart
          - text: _("Disable")
            icon: mdi:arrow-down-bold-outline
            execute:
              type: request
              request:
                service: MicroVm
                method: doCommand
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  command: "autostartdisable"
                progressMessage: _("Disabling autostart ...")
                successNotification: _("Autostart has been disabled.")
                task: false
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
              constraint:
                - operator: truthy
                  arg0:
                    prop: autostart
      - type: menu
        icon: delete
        tooltip: _("Delete")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: ne
              arg0:
                prop: state
              arg1: "running"
        actions:
          - text: _("Delete")
            icon: mdi:delete-outline
            confirmationDialogConfig:
              template: confirmation-danger
              message: _("Are you sure you want to delete this VM? Its working directory (writable rootfs copy) will also be removed.")
            execute:
              type: request
              request:
                service: MicroVm
                method: doCommand
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  command: "delete"
                progressMessage: _("Deleting ...")
                successNotification: _("Deleted.")
                task: false
